# mpv keybindings for `wavspec` — arrow keys step between files rather than
# seeking within one, which is what you want when auditioning a directory of
# short calls. mpv's own `<` / `>` playlist bindings are left intact.
RIGHT playlist-next
LEFT  playlist-prev
UP    playlist-next
DOWN  playlist-prev

# Seeking moves to the modifier'd arrows instead.
Shift+RIGHT seek  1
Shift+LEFT  seek -1
