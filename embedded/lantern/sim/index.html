<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Simulator</title>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root {
    --bg: #0d0e10; --panel: #15171a; --line: #262a2f; --text: #d9dde2; --dim: #8a929c;
    --accent: #f0a646; --good: #6cc48a; --bad: #e0675c;
    font: 13px/1.4 system-ui, sans-serif; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: grid;
       grid-template-columns: 1fr 380px; overflow: hidden; }
#stage { position: relative; display: grid; grid-template-rows: 1fr auto; min-width: 0; }
#view { width: 100%; height: 100%; display: block; min-height: 0; }
#strips { padding: 10px 14px 14px; border-top: 1px solid var(--line); }
#strips canvas { width: 100%; height: 56px; display: block; image-rendering: pixelated; }
.overlay { position: absolute; left: 14px; top: 12px; color: var(--dim); font-variant-numeric: tabular-nums;
           pointer-events: none; white-space: pre; }
#error { position: absolute; inset: 40px 20px auto; background: #2a1414; border: 1px solid var(--bad);
         padding: 12px; white-space: pre-wrap; font: 12px ui-monospace, monospace; max-height: 60%;
         overflow: auto; display: none; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 40px; }
h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 18px 0 8px;
     font-weight: 600; }
.programs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
button { background: #1f2226; color: var(--text); border: 1px solid var(--line); border-radius: 5px;
         padding: 6px 8px; font: inherit; cursor: pointer; }
button:hover { border-color: #3a4048; }
button.on { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
.row { display: grid; grid-template-columns: 1fr 120px 64px; gap: 8px; align-items: center; margin: 3px 0; }
.row label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
.row label.changed::after { content: " ●"; color: var(--accent); font-size: 9px; vertical-align: middle; }
.row input[type=range] { width: 100%; accent-color: var(--accent); }
.row input[type=number], .row select { width: 100%; background: #0f1113; color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font: inherit; font-size: 12px; }
.row select { grid-column: 2 / 4; }
.row input[type=checkbox] { justify-self: start; accent-color: var(--accent); }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
summary .count { color: var(--accent); font-weight: 400; margin-left: 6px; }
.meter { height: 6px; background: #0f1113; border-radius: 3px; overflow: hidden; margin: 4px 0 2px; }
.meter div { height: 100%; background: var(--good); width: 0; }
.note { color: var(--dim); font-size: 12px; }
#status { font: 11px ui-monospace, monospace; color: var(--dim); word-break: break-word; }
#log { font: 11px ui-monospace, monospace; color: var(--dim); background: #0f1113; border: 1px solid var(--line);
       border-radius: 4px; height: 90px; overflow-y: auto; padding: 4px 6px; white-space: pre-wrap; margin-top: 6px; }
@media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; overflow: auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div id="stage">
    <canvas id="view"></canvas>
    <div class="overlay" id="readout"></div>
    <div id="error"></div>
    <div id="strips"><canvas id="strip" width="45" height="2"></canvas></div>
</div>
<aside>
    <h1>Lantern simulator</h1>
    <div class="programs" id="programs"></div>

    <h2>Simulation</h2>
    <div class="buttons">
        <button id="pause">Pause</button>
        <button id="restart" title="New random seed; every program starts over">Restart</button>
    </div>
    <div class="row"><label title="Simulated time per real second">speed</label>
        <input type="range" id="speed" min="0.1" max="8" step="0.1" value="1"><input type="number" id="speed-n" step="0.1" value="1"></div>
    <div class="row"><label title="One pass of the ESP's main loop: the 10 ms delay plus compute and FastLED.show. 'Measure' reads it from the lantern.">loop ms</label>
        <input type="range" id="loop" min="10" max="40" step="0.5" value="14"><input type="number" id="loop-n" step="0.5" value="14"></div>
    <div class="row"><label title="Time between a program's step and the render in one pass. Fades that restart every pass (reaction-diffusion) only move this far each pass.">step→render ms</label>
        <input type="range" id="lag" min="0" max="10" step="0.1" value="1"><input type="number" id="lag-n" step="0.1" value="1"></div>
    <div class="note">Current draw <span id="ma">0</span> mA of <span id="ma-cap">900</span>, brightness <span id="bright">255</span></div>
    <div class="meter"><div id="ma-bar"></div></div>
    <div id="status"></div>

    <h2>View</h2>
    <div class="row"><label>paper</label><input type="range" id="paper" min="0" max="1" step="0.01" value="0.55"><span></span></div>
    <div class="row"><label>glow</label><input type="range" id="glow" min="0" max="3" step="0.05" value="1"><span></span></div>
    <div class="row"><label>auto-rotate</label><input type="checkbox" id="spin" checked><span></span></div>

    <h2>Lantern</h2>
    <div class="buttons">
        <button id="connect" title="Web Serial, Chrome or Edge only">Connect</button>
        <button id="measure" disabled title="Ask the lantern how long its main loop takes">Measure loop</button>
        <button id="send-all" disabled title="Send every setting to the lantern">Send all</button>
    </div>
    <div class="row"><label title="Send each change to the lantern as it's made">live</label><input type="checkbox" id="live" checked><span></span></div>
    <div class="buttons" style="margin-top:8px">
        <button id="save" title="Write the changed settings into src/params.h as the boot values">Save to params.h</button>
        <button id="flash" title="Build the firmware and upload it to the ESP32 with PlatformIO">Flash ESP</button>
    </div>
    <div id="log"></div>

    <h2>Settings</h2>
    <div class="note">● differs from params.h; double-click a name to reset it.</div>
    <div id="params"></div>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
