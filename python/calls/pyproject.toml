[project]
name = "callsong"
version = "0.1.0"
description = "Generative animal-call synthesis: nonlinear syrinx oscillators illuminated by MAP-Elites over BirdNET-embedding descriptors"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jax[cuda12]>=0.4.28,<0.5",
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tensorflow-cpu==2.15.1",
    "birdnetlib>=0.17",
    "librosa>=0.10",
    "resampy>=0.4",
    "soundfile>=0.12",
    "hydra-core>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[tool.setuptools]
packages = ["callsong"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
