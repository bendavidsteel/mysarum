requires-python = ">=3.11,<3.14"
dependencies = [
    "jax[cuda12]",
    "numpy",
    "matplotlib",
    "networkx",
    "hydra-core",
    "tqdm",
    "imageio",
    "imageio-ffmpeg",
]
